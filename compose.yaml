name: firenav

x-firenav-environment: &firenav-environment
  HOME: /tmp/firenav-home
  XDG_CACHE_HOME: /tmp/firenav-home/.cache
  MPLCONFIGDIR: /tmp/firenav-home/.cache/matplotlib
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  NVIDIA_VISIBLE_DEVICES: ${FIRENAV_NVIDIA_VISIBLE_DEVICES:-all}
  NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  FIRENAV_DATA_ROOT: /workspace/data
  FIRENAV_OUTPUT_ROOT: /workspace/outputs
  FIRENAV_MOBILE_SAM_PATH: /workspace/mobile_sam.pt
  FIRENAV_YOLO_WORLD_PATH: /workspace/yolov8l-world.pt

services:
  firenav:
    image: ${FIRENAV_IMAGE:-firenav:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${FIRENAV_VCS_REF:-unknown}
    init: true
    ipc: host
    shm_size: 8gb
    gpus: all
    user: "${FIRENAV_HOST_UID:-1000}:${FIRENAV_HOST_GID:-1000}"
    working_dir: /workspace
    environment: *firenav-environment
    volumes:
      - type: bind
        source: ${FIRENAV_DATA_DIR:-./data}
        target: /workspace/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FIRENAV_OUTPUT_DIR:-./outputs/docker}
        target: /workspace/outputs
      - type: bind
        source: ${FIRENAV_MOBILE_SAM_PATH:-./mobile_sam.pt}
        target: /workspace/mobile_sam.pt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FIRENAV_YOLO_WORLD_PATH:-./yolov8l-world.pt}
        target: /workspace/yolov8l-world.pt
        read_only: true
        bind:
          create_host_path: false
    command: ["preflight", "--mode", "navigation", "--strict"]
    stdin_open: true
    tty: true

  firenav-test:
    image: ${FIRENAV_IMAGE:-firenav:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${FIRENAV_VCS_REF:-unknown}
    profiles: ["test"]
    init: true
    shm_size: 2gb
    user: "${FIRENAV_HOST_UID:-1000}:${FIRENAV_HOST_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp/firenav-home
      XDG_CACHE_HOME: /tmp/firenav-home/.cache
      MPLCONFIGDIR: /tmp/firenav-home/.cache/matplotlib
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["test"]
